name: Package and Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  package:
    permissions:
      contents: write   # to upload release assets
      id-token: write   # for cosign OIDC keyless signing

    name: Package for nginx ${{ matrix.nginx_version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      NGINX_VERSION: ${{ matrix.nginx_version }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      RPM_ARCH: ${{ matrix.rpm_arch }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NGINX_DEB_RELEASE: 1~noble
      NGINX_RPM_RELEASE: 1.el9.ngx
      # LIBCORAZA_VERSION / LIBCORAZA_SHA256 are loaded from .github/versions.env
      # (single source of truth) in the "Load libcoraza pin" step below.
      # sha256 of nginx-1.30.3.tar.gz from nginx.org — update together with the matrix
      NGINX_SHA256: "e5823dc6f45610993def93ebf6cfce68264af4958c77e874b7d20f3709001b8f"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    strategy:
      matrix:
        nginx_version: ['1.30.3']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Load the shared libcoraza pin so the released artifact builds against
      # the same version CI does (.github/versions.env is the single source of
      # truth), instead of a stale hardcoded value.
      - name: Load libcoraza pin
        run: |
          set -a; . .github/versions.env; set +a
          echo "LIBCORAZA_VERSION=$LIBCORAZA_VERSION" >> "$GITHUB_ENV"
          echo "LIBCORAZA_SHA256=$LIBCORAZA_SHA256" >> "$GITHUB_ENV"

      - name: Download nginx
        run: |
          cd "$GITHUB_WORKSPACE"
          wget "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          echo "${NGINX_SHA256}  nginx-${NGINX_VERSION}.tar.gz" | sha256sum -c -
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"

      - name: Download libcoraza
        run: |
          cd "$GITHUB_WORKSPACE"
          archive_base=https://github.com/corazawaf/libcoraza/archive/refs/tags
          wget "${archive_base}/${LIBCORAZA_VERSION}.zip"
          echo "${LIBCORAZA_SHA256}  ${LIBCORAZA_VERSION}.zip" | sha256sum -c -
          unzip -o "${LIBCORAZA_VERSION}.zip"

      # NB: no ccache / Go build-cache restore in this job. It runs only on
      # release:published with contents:write + id-token:write and emits
      # cosign-signed artifacts. Restoring a build cache that a lower-trust PR
      # run could have poisoned would let attacker-controlled objects be
      # compiled/linked into a signed release (zizmor cache-poisoning). Build
      # caches live in the ci-*/build workflows only; the release build is cold.

      - name: Install build dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get -qq update
          sudo apt-get -y -qq \
          --fix-missing --no-install-recommends install \
          gcc make ruby ruby-dev rubygems build-essential ccache eatmydata \
          dpkg-dev rpm autoconf automake libtool diffutils unzip \
          libpcre2-dev zlib1g-dev libssl-dev
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          sudo gem install --no-document fpm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ^1.25.x
          cache: false   # release job: don't restore a PR-poisonable module cache

      # Build libcoraza
      - name: Build libcoraza
        run: |
          cd libcoraza-*
          ./build.sh
          ./configure
          eatmydata make
          sudo eatmydata make install
          sudo ldconfig

      - name: Configure compilation of dynamic module
        run: |
          cd "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}"
          ./configure \
          --with-compat \
          --add-dynamic-module="$GITHUB_WORKSPACE/" \
          --with-cc-opt='-g -O2 -fstack-protector-strong -Wformat -Werror=format-security -Wno-unused-function -fPIC -Wdate-time -D_FORTIFY_SOURCE=2' \
          --with-ld-opt='-Wl,-Bsymbolic-functions -Wl,-z,relro -Wl,-z,now -fPIC' \
          --prefix=/etc/nginx \
          --sbin-path=/usr/sbin/nginx \
          --conf-path=/etc/nginx/nginx.conf \
          --http-log-path=/var/log/nginx/access.log \
          --error-log-path=/var/log/nginx/error.log \
          --lock-path=/var/lock/nginx.lock \
          --pid-path=/run/nginx.pid \
          --modules-path=/usr/lib/nginx/modules \
          --http-client-body-temp-path=/var/cache/nginx/client_temp \
          --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
          --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
          --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
          --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
          --with-debug \
          --with-threads \
          --with-http_ssl_module \
          --with-http_realip_module \
          --with-http_auth_request_module \
          --with-http_v2_module \
          --with-http_v3_module \
          --with-http_sub_module

      - name: Compile dynamic module
        run: |
          cd "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}"
          eatmydata make modules

      - name: Build RPM module against Rocky Linux 9
        run: |
          docker run --rm \
            -e NGINX_VERSION -e LIBCORAZA_VERSION \
            -e NGINX_SHA256 -e LIBCORAZA_SHA256 \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$(go env GOROOT):/opt/go:ro" \
            rockylinux:9 bash /src/ci/build-rpm-module.sh

      - name: Create packages
        run: |
          DEB_ARCH="${DEB_ARCH:?matrix.deb_arch is required}"
          RPM_ARCH="${RPM_ARCH:?matrix.rpm_arch is required}"
          # Strip leading 'v' from tag (e.g. v1.2.3 -> 1.2.3)
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          DEB_NGINX_VERSION="${NGINX_VERSION}-${NGINX_DEB_RELEASE}"
          RPM_NGINX_VERSION="${NGINX_VERSION}-${NGINX_RPM_RELEASE}"

          # Populate staging directory
          mkdir -p /tmp/pkg/usr/lib/nginx/modules
          mkdir -p /tmp/pkg/usr/local/lib
          mkdir -p /tmp/pkg/etc/ld.so.conf.d
          printf '%s\n' '/usr/local/lib' > \
            /tmp/pkg/etc/ld.so.conf.d/coraza-nginx.conf
          module_dir="$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs"
          cp "$module_dir/ngx_http_coraza_module.so" \
             /tmp/pkg/usr/lib/nginx/modules/ngx_http_coraza_module.so
          cp /usr/local/lib/libcoraza.so /tmp/pkg/usr/local/lib/libcoraza.so
          mkdir -p /tmp/rpm-pkg/usr/lib/nginx/modules \
            /tmp/rpm-pkg/usr/local/lib /tmp/rpm-pkg/etc/ld.so.conf.d
          cp rpm-output/ngx_http_coraza_module.so \
            /tmp/rpm-pkg/usr/lib/nginx/modules/
          cp rpm-output/libcoraza.so /tmp/rpm-pkg/usr/local/lib/
          cp /tmp/pkg/etc/ld.so.conf.d/coraza-nginx.conf \
            /tmp/rpm-pkg/etc/ld.so.conf.d/

          PKGBASE="coraza-nginx_${VERSION}_nginx${NGINX_VERSION}_${DEB_ARCH}"
          printf '%s\n' '#!/bin/sh' 'set -e' 'ldconfig' > \
            "$RUNNER_TEMP/coraza-ldconfig.sh"
          chmod 755 "$RUNNER_TEMP/coraza-ldconfig.sh"

          # Resolve the exact runtime libraries from both ELF objects using
          # the target Ubuntu release's shlibs database.
          mkdir -p debian
          printf '%s\n' 'Source: coraza-nginx' '' \
            'Package: coraza-nginx' 'Architecture: any' \
            'Description: Coraza nginx dynamic module' > debian/control
          mapfile -t DEB_LIB_DEPS < <(dpkg-shlibdeps --ignore-missing-info -O \
            -e/tmp/pkg/usr/lib/nginx/modules/ngx_http_coraza_module.so \
            -e/tmp/pkg/usr/local/lib/libcoraza.so \
            2> "$RUNNER_TEMP/shlibdeps.log" \
            | sed -n 's/^shlibs:Depends=//p' | tr ',' '\n' | sed 's/^ *//')
          test "${#DEB_LIB_DEPS[@]}" -gt 0
          DEB_ARGS=(--depends "nginx = ${DEB_NGINX_VERSION}")
          for dependency in "${DEB_LIB_DEPS[@]}"; do
            DEB_ARGS+=(--depends "$dependency")
          done

          # Create .deb (Debian/Ubuntu)
          fpm -s dir -t deb \
            -n coraza-nginx \
            -v "${VERSION}" \
            --description "Coraza WAF nginx dynamic module" \
            --url "https://github.com/corazawaf/coraza-nginx" \
            --license "Apache-2.0" \
            --architecture "$DEB_ARCH" \
            "${DEB_ARGS[@]}" \
            --after-install "$RUNNER_TEMP/coraza-ldconfig.sh" \
            --after-remove "$RUNNER_TEMP/coraza-ldconfig.sh" \
            --maintainer "Coraza <security@coraza.io>" \
            --vendor "Coraza" \
            -C /tmp/pkg \
            --package "${PKGBASE}.deb" \
            .

          # Create .rpm (RHEL/CentOS/Rocky Linux/Fedora)
          fpm -s dir -t rpm \
            -n coraza-nginx \
            -v "${VERSION}" \
            --description "Coraza WAF nginx dynamic module" \
            --url "https://github.com/corazawaf/coraza-nginx" \
            --license "Apache-2.0" \
            --architecture "$RPM_ARCH" \
            --depends "nginx = 2:${RPM_NGINX_VERSION}" \
            --rpm-autoreqprov \
            --after-install "$RUNNER_TEMP/coraza-ldconfig.sh" \
            --after-remove "$RUNNER_TEMP/coraza-ldconfig.sh" \
            --maintainer "Coraza <security@coraza.io>" \
            --vendor "Coraza" \
            -C /tmp/rpm-pkg \
            --package "${PKGBASE}.rpm" \
            .

          # FPM writes into the workspace, the step's working directory.
          test -s "${PKGBASE}.deb"
          test -s "${PKGBASE}.rpm"

      - name: Upload packages as artifacts for install tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-nginx${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/coraza-nginx_*_nginx${{ matrix.nginx_version }}_${{ matrix.arch }}.deb
            ${{ github.workspace }}/coraza-nginx_*_nginx${{ matrix.nginx_version }}_${{ matrix.arch }}.rpm
          retention-days: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign packages with cosign (keyless)
        run: |
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          PKGBASE="coraza-nginx_${VERSION}_nginx${NGINX_VERSION}_${DEB_ARCH}"

          cosign sign-blob --yes \
            --bundle "${PKGBASE}.deb.bundle" \
            "${PKGBASE}.deb"

          cosign sign-blob --yes \
            --bundle "${PKGBASE}.rpm.bundle" \
            "${PKGBASE}.rpm"

      - name: Upload packages and signatures to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            coraza-nginx_*_nginx${{ matrix.nginx_version }}_${{ matrix.arch }}.deb
            coraza-nginx_*_nginx${{ matrix.nginx_version }}_${{ matrix.arch }}.deb.bundle
            coraza-nginx_*_nginx${{ matrix.nginx_version }}_${{ matrix.arch }}.rpm
            coraza-nginx_*_nginx${{ matrix.nginx_version }}_${{ matrix.arch }}.rpm.bundle

  install-test:
    permissions:
      contents: read
    name: Install test (${{ matrix.pkg_type }}, nginx ${{ matrix.nginx_version }}, ${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.runner }}
    env:
      NGINX_VERSION: ${{ matrix.nginx_version }}
      PKG_ARCH: ${{ matrix.arch }}
    strategy:
      matrix:
        nginx_version: ['1.30.3']
        arch: [amd64, arm64]
        pkg_type: [deb, rpm]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout verification script
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Download packages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-nginx${{ matrix.nginx_version }}-${{ matrix.arch }}

      - name: Test deb installation
        if: matrix.pkg_type == 'deb'
        run: bash ci/package-smoke.sh deb

      - name: Test rpm installation
        if: matrix.pkg_type == 'rpm'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/packages:ro" \
            -e NGINX_VERSION -e PKG_ARCH \
            rockylinux:9 bash /packages/ci/package-smoke.sh rpm
