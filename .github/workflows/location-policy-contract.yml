---
name: Location policy contracts

'on':
  push:
    branches: [main, master, dev, "[0-9][0-9]-*"]
  pull_request: {}
  workflow_dispatch: {}

permissions: {}

jobs:
  location-policy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -y -qq --no-install-recommends install \
            gcc libc6-dev make perl golang-go curl ca-certificates unzip \
            libpcre2-dev zlib1g-dev
      - name: Build module and test final-location policy ownership
        run: bash ci/location-policy-build.sh
